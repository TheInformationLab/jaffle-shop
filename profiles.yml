default: # Profile name (matches dbt_project.yml)
  target: default # Default target to use
  outputs:
    default:
      type: snowflake
      account: "{{ env_var('DB_ACCOUNT') }}" # Snowflake <account_name>
      user: "{{ env_var('DB_USER') }}" #have to use email
      role: "{{ env_var('DB_ROLE') }}"
      private_key: "{{ env_var('DB_KEYPAIR') }}" # Path to your private key file
      private_key_passphrase: "{{ env_var('DB_KEYPAIR_PASSPHRASE')}}"
      database: "{{ env_var('DB_DATABASE') }}" # Snowflake database name
      warehouse: "{{ env_var('DB_WAREHOUSE') }}" # Snowflake warehouse name
      schema: "{{ env_var('DB_SCHEMA') }}" # REPLACE WITH YOUR OWN SCHEMA
      threads: 32
      client_session_keep_alive: false

      # optional
      connect_retries: 0 # default 0
      connect_timeout: 10 # default: 10
      retry_on_database_errors: True # default: true
      retry_all: False # default: false
      reuse_connections: True # default: True if client_session_keep_alive is False, otherwise None
